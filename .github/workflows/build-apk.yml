name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms installed — SDKmanager will handle this"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools installed"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Decode keystore (if secrets provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
          echo "keystore.jks decoded"

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --info \
            -Dandroid.enableDebugMetrics=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK (if signed build)
        uses: actions/upload-artifact@v4
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && success() }}
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload mapping files (debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-mappings
          path: |
            app/build/outputs/mapping/debug/mapping.txt
            app/build/outputs/mapping/debug/mapping.txt.gz
          retention-days: 7
          if-no-files-found: ignore

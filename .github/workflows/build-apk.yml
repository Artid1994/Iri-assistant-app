name: Build Android APK (Stage 21)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Download LFS assets
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          else
            echo "sdkmanager not found, attempting global sdkmanager..."
            yes | sdkmanager --licenses || true
          fi
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace --info

      - name: Patch all .so binaries to 16KB alignment
        working-directory: android
        run: |
          echo "=== Unpacking APK ==="
          APK_DIR="tmp_apk_patch"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          mkdir -p "$APK_DIR"
          unzip -o "$APK" -d "$APK_DIR"

          echo "=== Patching all .so files ==="
          python3 scripts/patch_so_16kb.py --recursive "$APK_DIR"

          echo "=== Verifying p_align = 0x4000 on all patched .so files ==="
          find "$APK_DIR" -name "*.so" -type f | while read so; do
            echo "--- $(basename $so) ---"
            readelf -Wl "$so" 2>&1 | grep -E "LOAD|Align" | head -4
          done

          echo "=== Repacking APK ==="
          # Remove old APK, create new one from patched contents
          # CRITICAL: resources.arsc and .so files MUST be stored uncompressed (0% compression)
          # for Android 11+ (API 30+) installation compatibility (adb error -124 fix)
          rm -f "$APK"
          cd "$APK_DIR"
          # Step 1: Store critical files uncompressed
          zip -q -r -0 "../$APK_DIR.zip" resources.arsc lib/ assets/ 2>/dev/null
          # Step 2: Add remaining files with normal compression
          zip -q -r "../$APK_DIR.zip" . -x "resources.arsc" "lib/*" "assets/*" 2>/dev/null
          cd ..
          mv "$APK_DIR.zip" "$APK"
          rm -rf "$APK_DIR"

          echo "=== Verifying resources.arsc stored uncompressed ==="
          unzip -l "$APK" | grep resources.arsc

      - name: Zipalign patched APK
        working-directory: android
        run: |
          export PATH="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1):$PATH"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Zipaligning: $APK"
          # -p 4: page-aligned (4-byte) alignment for Android 11+ compatibility
          zipalign -v -p 4 "$APK" app-debug-aligned.apk
          mv app-debug-aligned.apk "$APK"
          echo "Zipaligned APK: $APK"
          # Verify alignment
          unzip -l "$APK" | grep -E "resources.arsc|\.so$"

      - name: Sign patched APK
        working-directory: android
        run: |
          export PATH="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1):$JAVA_HOME/bin:$PATH"
          # Generate debug keystore if missing
          if [ ! -f "$ANDROID_HOME/debug.keystore" ]; then
            keytool -genkey -v -keystore "$ANDROID_HOME/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Signing: $APK"
          apksigner sign \
            --ks $ANDROID_HOME/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-debug-signed.apk \
            "$APK"
          mv app-debug-signed.apk "$APK"
          echo "Signed APK: $APK"
          apksigner verify --verbose "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ===================================================================
      # Hermes Auto-Fix Loop: analyzes failure logs, searches for precise
      # resolution patterns in codebase/docs BEFORE applying any patch.
      # No speculative guessing — every fix must be grounded in evidence.
      # Limited to 10 retries via github.run_attempt.
      # ===================================================================
      - name: Hermes Auto-Fix Loop (no-guessing policy)
        if: failure() && github.run_attempt <= 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        working-directory: android
        run: |
          set -e
          echo "============================================"
          echo "Hermes Auto-Fix Loop — Attempt $RUN_ATTEMPT"
          echo "Run ID: $RUN_ID"
          echo "============================================"

          # ------------------------------------------------------------------
          # STEP 1: Fetch exact failure logs via gh CLI (no speculation)
          # ------------------------------------------------------------------
          echo "=== Fetching failure logs from GitHub Actions ==="
          gh run view $RUN_ID --log-failed > /tmp/failure_logs.txt 2>&1 || true
          echo "--- Failure logs (last 200 lines) ---"
          tail -200 /tmp/failure_logs.txt

          # ------------------------------------------------------------------
          # STEP 2: Identify the failing command and error signature
          # ------------------------------------------------------------------
          echo "=== Extracting failure signature ==="
          FAILURE_SIGNATURE=$(grep -E "command not found|FileNotFoundException|error:|FAIL|Exception|Error" /tmp/failure_logs.txt | tail -5 | head -1 || echo "unknown")
          echo "Failure signature: $FAILURE_SIGNATURE"

          # ------------------------------------------------------------------
          # STEP 3: Search codebase for precise resolution patterns
          #   POLICY: NEVER apply a fix unless a matching pattern is found
          #   in the codebase, docs, or prior commit history.
          # ------------------------------------------------------------------
          echo "=== Searching codebase for resolution patterns ==="

          # Pattern 1: zipalign/apksigner command not found -> build-tools PATH
          if echo "$FAILURE_SIGNATURE" | grep -q "command not found"; then
            CMD=$(echo "$FAILURE_SIGNATURE" | awk '{print $1}')
            echo "Pattern matched: '$CMD' command not found"
            echo "Searching for PATH fix patterns in workflow..."
            if grep -q "build-tools" .github/workflows/build-apk.yml 2>/dev/null; then
              echo "RESOLUTION FOUND: build-tools PATH export already exists in workflow."
              echo "Verify the failing command is covered by the PATH export."
              # Check if the failing command is in build-tools
              if ls $ANDROID_HOME/build-tools/*/$CMD 2>/dev/null; then
                echo "FIX VERIFIED: $CMD exists in build-tools. Ensuring PATH is exported."
                # The fix is to ensure PATH includes build-tools — already in workflow
                # Force re-run by touching the workflow to trigger change detection
                echo "Touching workflow to trigger retry with verified PATH..."
              else
                echo "WARNING: $CMD not found in build-tools. Cannot apply automated fix."
                exit 1
              fi
            fi
          fi

          # Pattern 2: debug.keystore not found -> generate via keytool
          if echo "$FAILURE_SIGNATURE" | grep -q "debug.keystore" && echo "$FAILURE_SIGNATURE" | grep -q "FileNotFoundException"; then
            echo "Pattern matched: debug.keystore missing"
            echo "Searching for keytool generation pattern..."
            if grep -q "keytool -genkey" .github/workflows/build-apk.yml 2>/dev/null; then
              echo "RESOLUTION FOUND: keytool generation already in workflow."
            else
              echo "Applying fix: add keytool debug keystore generation"
              # Apply the fix inline
              sed -i '/name: Sign patched APK/a\          # Generate debug keystore if missing\n          if [ ! -f "$ANDROID_HOME/debug.keystore" ]; then\n            keytool -genkey -v -keystore "$ANDROID_HOME/debug.keystore" \\\\\n              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \\\\\n              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"\n          fi' .github/workflows/build-apk.yml
              echo "Fix applied: debug keystore generation"
            fi
          fi

          # Pattern 3: 16KB alignment failure -> check patch_so_16kb.py
          if echo "$FAILURE_SIGNATURE" | grep -q "patch_so_16kb\|16KB\|p_align"; then
            echo "Pattern matched: 16KB alignment issue"
            echo "Searching for patch script and alignment fixes..."
            if [ -f scripts/patch_so_16kb.py ]; then
              echo "RESOLUTION FOUND: patch_so_16kb.py exists in codebase."
              echo "Verifying script is executable and correct..."
              python3 -c "import sys; sys.path.insert(0, 'scripts'); import patch_so_16kb" 2>/dev/null && echo "Script imports OK" || echo "Script import check failed"
            fi
          fi

          # Pattern 4: Gradle build failure -> check gradle config
          if echo "$FAILURE_SIGNATURE" | grep -q "Gradle|gradle|BUILD" ; then
            echo "Pattern matched: Gradle build failure"
            echo "Searching for Gradle resolution patterns..."
            if [ -f build.gradle.kts ] || [ -f app/build.gradle.kts ]; then
              echo "RESOLUTION FOUND: Gradle build files present."
              echo "Checking for common Gradle issues..."
              grep -r "ndk" build.gradle.kts app/build.gradle.kts 2>/dev/null && echo "NDK config found" || echo "No NDK config"
            fi
          fi

          # Pattern 5: Java heap space -> increase JVM args in gradle.properties
          if echo "$FAILURE_SIGNATURE" | grep -q "Java heap space\|OutOfMemoryError\|heap space"; then
            echo "Pattern matched: Java heap space / OOM"
            echo "Searching for JVM args configuration..."
            if [ -f android/gradle.properties ]; then
              if grep -q "org.gradle.jvmargs" android/gradle.properties 2>/dev/null; then
                echo "RESOLUTION FOUND: org.gradle.jvmargs already configured."
                # Extract current Xmx value
                CURRENT_XMX=$(grep "org.gradle.jvmargs" android/gradle.properties | grep -oP '\-Xmx\d+m' | head -1)
                echo "Current Xmx: $CURRENT_XMX"
                # If less than 2048m, upgrade
                if echo "$CURRENT_XMX" | grep -qE "\-Xmx[0-9]+m"; then
                  CURRENT_NUM=$(echo "$CURRENT_XMX" | grep -oP '\d+' | head -1)
                  if [ "$CURRENT_NUM" -lt 2048 ]; then
                    echo "Upgrading Xmx from ${CURRENT_NUM}m to 2048m"
                    sed -i "s/-Xmx${CURRENT_NUM}m/-Xmx2048m/g" android/gradle.properties
                    echo "Fix applied: increased JVM heap to 2048m"
                  fi
                fi
              else
                echo "Applying fix: add org.gradle.jvmargs to gradle.properties"
                echo "" >> android/gradle.properties
                echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
                echo "Fix applied: JVM heap increased to 2048m"
              fi
            else
              echo "WARNING: android/gradle.properties not found. Cannot apply heap fix."
            fi
          fi

          # Pattern 6: adb error -124 / installation failure -> resources.arsc uncompressed
          if echo "$FAILURE_SIGNATURE" | grep -q "\-124\|installation failed\|INSTALL_FAILED_UPDATE_INCOMPATIBLE\|resources.arsc"; then
            echo "Pattern matched: adb error -124 / installation failure"
            echo "Searching for resources.arsc compression fix..."
            if grep -q "zip -0" .github/workflows/build-apk.yml 2>/dev/null; then
              echo "RESOLUTION FOUND: resources.arsc already stored uncompressed in workflow."
            else
              echo "Applying fix: store resources.arsc uncompressed in re-pack step"
              # Update the repack step to use zip -0 for resources.arsc and lib/
              sed -i 's/zip -r -y ".\/\\$APK_DIR.zip" \. 2>\/dev\/null || zip -r ".\/\\$APK_DIR.zip" \./# Store critical files uncompressed\n          zip -q -r -0 ".\/\$APK_DIR.zip" resources.arsc lib\/ assets\/ 2>\/dev\/null\n          zip -q -r ".\/\$APK_DIR.zip" . -x "resources.arsc" "lib\/*" "assets\/*" 2>\/dev\/null/' .github/workflows/build-apk.yml
              echo "Fix applied: resources.arsc stored uncompressed"
            fi
          fi

          # ------------------------------------------------------------------
          # STEP 4: If any fix was applied, commit and push to retrigger
          # ------------------------------------------------------------------
          echo "=== Checking if fixes were applied ==="
          if git diff --quiet; then
            echo "No changes to commit. Failure could not be auto-resolved."
            echo "Please inspect /tmp/failure_logs.txt manually."
            exit 1
          else
            echo "Changes detected. Committing and pushing to retrigger workflow..."
            git config user.name "Hermes Auto-Fix"
            git config user.email "hermes@auto-fix.local"
            git add .github/workflows/build-apk.yml
            git commit -m "auto-fix: resolve failure at attempt $RUN_ATTEMPT (evidence-based, no-guessing)"
            git push origin main
            echo "=== Push complete. Workflow will re-trigger. ==="
          fi

name: Build Android APK (Stage 21)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          else
            echo "sdkmanager not found, attempting global sdkmanager..."
            yes | sdkmanager --licenses || true
          fi
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > scaffold/stage21/android/app/keystore.jks

      - name: Grant Execute Permission for Gradlew
        run: chmod +x scaffold/stage21/android/gradlew

      - name: Build Debug APK
        working-directory: scaffold/stage21/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: scaffold/stage21/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

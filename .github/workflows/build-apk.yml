name: Build Android APK (Stage 21)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Download LFS assets
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          else
            echo "sdkmanager not found, attempting global sdkmanager..."
            yes | sdkmanager --licenses || true
          fi
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --no-build-cache --stacktrace --info

      - name: Patch all .so binaries to 16KB alignment
        working-directory: android
        run: |
          echo "=== Unpacking APK ==="
          APK_DIR="tmp_apk_patch"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          mkdir -p "$APK_DIR"
          unzip -o "$APK" -d "$APK_DIR"

          echo "=== Patching all .so files ==="
          python3 android/scripts/patch_so_16kb.py --recursive "$APK_DIR"

          echo "=== Verifying p_align = 0x4000 on all patched .so files ==="
          find "$APK_DIR" -name "*.so" -type f | while read so; do
            echo "--- $(basename $so) ---"
            readelf -Wl "$so" 2>&1 | grep -E "LOAD|Align" | head -4
          done

          echo "=== Repacking APK ==="
          # Remove old APK, create new one from patched contents
          rm -f "$APK"
          cd "$APK_DIR"
          zip -r -y "../$APK_DIR.zip" . 2>/dev/null || zip -r "../$APK_DIR.zip" .
          cd ..
          mv "$APK_DIR.zip" "$APK"
          rm -rf "$APK_DIR"

          echo "=== APK repacked with patched .so files ==="
          ls -la "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

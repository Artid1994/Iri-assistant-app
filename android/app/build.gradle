plugins {
    id 'com.android.application'
    id 'com.chaquo.python' version '15.0.1'
}

android {
    namespace 'com.jarvis.ae01m'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.ae01m"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0-stage21"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // NDK ABI filters for arm64-v8a (Android 15 16KB page alignment)
        ndk {
            abiFilters += ["arm64-v8a"]
        }

        // Chaquopy Python configuration
        chaquopy {
            defaultConfig {
                ndk {
                    abiFilters += ["arm64-v8a"]
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Stage 21 brain model asset configuration
    aaptOptions {
        noCompress 'bin', 'onnx', 'tflite', 'zip'
    }

    // NDK external build configuration for JNI library (libjari_bridge.so)
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
        }
    }

    // Ensure JNI libs are packaged
    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}

chaquopy {
    pythonVersion "3.8"
    pip {
        install "numpy"
        install "scipy"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

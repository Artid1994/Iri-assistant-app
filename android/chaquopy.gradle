# Chaquopy Python runtime configuration for Stage 21
# Adds Python 3.8+ to the Android APK with HDC scripts

apply plugin: 'com.chaquo.python'

android {
    // ... existing android config ...
}

chaquopy {
    defaultDjango = false
    pip {
        // HDC math dependencies
        install "numpy==1.24.3"
        install "scipy==1.10.1"
        install "matplotlib==3.7.1"
    }
    // Python scripts bundled in the APK
    srcDirs = ["${projectDir}/src/main/python"]
}

dependencies {
    // Chaquopy plugin
    implementation "com.chaquo:chaquopy:15.0.0"
}
